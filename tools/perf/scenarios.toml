# Configuration and performance budgets for Truff v2 benchmarks.
# Reference: docs/superpowers/plans/2026-10-10-truff-v2.md (§10)

[benchmark_host]
os = "Linux (x86_64)"
display_server = "Wayland / X11"
resolution = "1920x1080"
scale = "100%"
build_profile = "release"
seed = 20261010

[thresholds.memory]
# Process RSS / PSS budgets (MiB)
empty_window_rss_limit_mib = 100.0
empty_window_rss_target_mib = 60.0
vault_10k_rss_limit_mib = 160.0
vault_10k_overhead_limit_mib = 60.0
vault_100k_rss_limit_mib = 240.0

[thresholds.latency]
# Latency budgets (milliseconds)
core_edit_p95_ms = 2.0
input_to_present_p95_ms = 25.0
warm_scroll_frame_p95_ms = 16.7
visible_layout_ready_p95_ms = 50.0
note_open_1mib_p95_ms = 100.0
search_first_page_p95_ms = 100.0
flash_labels_p95_ms = 30.0
warm_startup_p95_ms = 700.0

[thresholds.cpu]
idle_cpu_30s_max_percent = 1.0

# ---------------------------------------------------------------------------
# Benchmark Scenarios
# ---------------------------------------------------------------------------

[scenarios.startup]
description = "Measure process startup time from process launch until editor input is ready"
runs = 5
warmup = 1
collect_metrics = ["wall_time_ms", "rss_peak_mib", "pss_mib"]

[scenarios.edit-scroll]
description = "500 sequential edits with cursor movement and viewport scrolling in a 1 MiB note"
runs = 5
warmup = 1
events_per_run = 500
note_size_bytes = 1048576
collect_metrics = ["core_edit_latency_p95", "frame_latency_p95", "retained_rss_mib"]

[scenarios.flash]
description = "Compute and display jump labels across all visible words and syntax objects"
runs = 10
warmup = 2
collect_metrics = ["flash_latency_p95", "memory_delta_kib"]

[scenarios.search-during-index]
description = "Execute interactive FTS search queries while initial vault indexing is active"
runs = 5
warmup = 1
vault_notes = 10000
collect_metrics = ["query_latency_p95", "ui_responsiveness_ms"]

[scenarios.rename-recovery]
description = "Rename note referenced by 100 backlinks and verify atomic link update or recovery"
runs = 5
backlink_count = 100
collect_metrics = ["transaction_duration_ms", "fs_sync_duration_ms"]

[scenarios.memory-retention]
description = "Open and close 50 buffer views to verify absence of memory leaks in Rope/layout caches"
runs = 5
views_churn_count = 50
collect_metrics = ["rss_initial_mib", "rss_steady_mib", "rss_delta_mib"]

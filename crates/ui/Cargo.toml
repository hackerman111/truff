[package]
name = "truff-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "truff"

[[bin]]
name = "truff"
path = "src/main.rs"

[dependencies]
truff-core = { path = "../core" }
truff-store = { path = "../store" }
crop.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
toml.workspace = true
egui = { version = "=0.36.2", default-features = false, features = ["bytemuck", "default_fonts", "persistence"] }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links", "wayland", "x11", "serde"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "x11"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
ron = "0.12.2"

[features]
default = []
perf = []

